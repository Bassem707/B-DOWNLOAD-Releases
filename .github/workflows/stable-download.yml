name: Stable installer download
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stable-download.yml']
  release:
    types: [published, edited]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stable-installer
  cancel-in-progress: false
jobs:
  alias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: release } = await github.rest.repos.getLatestRelease({ owner, repo });
            const source = release.assets.find(a => /^B-DOWNLOAD-Setup-.*\.exe$/i.test(a.name));
            if (!source) throw new Error('Latest stable release has no Windows installer');
            const name = 'B-DOWNLOAD.exe';
            const existing = release.assets.find(a => a.name === name);
            if (existing && existing.size === source.size && existing.digest && existing.digest === source.digest) {
              core.info('Stable installer already matches latest release');
              return;
            }
            const response = await fetch(source.browser_download_url);
            if (!response.ok) throw new Error('Installer download failed: ' + response.status);
            const data = Buffer.from(await response.arrayBuffer());
            if (data.length !== source.size) throw new Error('Installer size mismatch');
            if (source.digest) {
              const crypto = require('crypto');
              const digest = 'sha256:' + crypto.createHash('sha256').update(data).digest('hex');
              if (digest !== source.digest) throw new Error('Installer SHA-256 mismatch');
            }
            if (existing) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: existing.id });
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id: release.id, name,
              data, headers: { 'content-type': 'application/octet-stream', 'content-length': data.length }
            });
            core.info('Stable installer published for ' + release.tag_name);
